name: CI

# Hermetic unit-test gate (`npm run ci`). No live services required.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test gate
        run: npm run ci

  # Coverage ratchet : re-run the unit suite under c8 and fail if
  # line or branch coverage drops below this repo's floor in
  # bin/coverage-thresholds.json (mirrored into the `coverage:check` npm script).
  # Catches silent coverage regression the pass/fail gate cannot see: a change
  # that keeps every test green while deleting the only test that reached a file.
  # These are RATCHET FLOORS (~1-1.5 points below measured), not tier targets;
  # raise them as coverage climbs.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Coverage thresholds (c8 --check-coverage)
        run: npm run coverage:check
